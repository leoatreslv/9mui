# ─────────────────────────────────────────────
# Reminder Bot — Configuration
# Copy this file to config.yaml and fill in values.
# ─────────────────────────────────────────────

# Which platforms to run concurrently. Each name needs its own block below.
#   platforms: [telegram]            # Telegram only (default)
#   platforms: [telegram, slack]     # both — reminders fan out to all
# Legacy single-platform form still works:
#   platform: telegram
platforms:
  - telegram
  # - slack

# ── Telegram ──────────────────────────────────
telegram:
  token: "YOUR_TELEGRAM_BOT_TOKEN"

  # @username of your bot (no @). Used to build secretary invite links:
  # https://t.me/<bot_username>?start=<token>
  bot_username: "your_bot_username"

  # Owner chat IDs — people who can run the bot as themselves and invite
  # secretaries. To find your chat ID: message @userinfobot on Telegram.
  # If empty, /invite is rejected (bot has no defined owner).
  allowed_chat_ids:
    - 123456789   # replace with your actual ID
  # - 987654321  # add more owners (each gets their own data + secretary pool)

  # Master switch for /invite. Set to false to lock the bot down.
  allow_invites: true

  # Cap on active (non-revoked) secretaries per owner.
  max_secretaries_per_owner: 5

# ── Slack ─────────────────────────────────────
# 1. Create an app at https://api.slack.com/apps
# 2. Enable Socket Mode → grab the app-level token (xapp-...)
# 3. Install to your workspace → grab the bot token (xoxb-...)
# 4. Register the slash commands and event subscriptions from
#    docs/slack-manifest.yaml
# 5. Find each user's Slack ID (open their profile → ⋮ → Copy member ID)
#    and add them to user_map below. The VALUE must be the user's
#    canonical chat_id — i.e. their Telegram chat_id, since v1 reuses
#    Telegram's numeric identity space.
#
# Invites stay Telegram-only in v1. To add a Slack-only secretary,
# invite them through Telegram first, then add their Slack ID here.
# slack:
#   bot_token: "xoxb-YOUR-BOT-TOKEN"
#   app_token: "xapp-YOUR-APP-TOKEN"
#   user_map:
#     U01ABCDEF: "123456789"   # Slack user → canonical (Telegram) chat_id
#     U02GHIJKL: "987654321"

# ── Discord (future) ──────────────────────────
# discord:
#   token: "YOUR_DISCORD_BOT_TOKEN"
#   guild_id: "YOUR_GUILD_ID"

# ── WhatsApp (future) ─────────────────────────
# whatsapp:
#   token: "YOUR_WHATSAPP_TOKEN"
#   phone_number_id: "YOUR_PHONE_NUMBER_ID"
#   verify_token: "YOUR_WEBHOOK_VERIFY_TOKEN"

# ── Reminder defaults ─────────────────────────
reminder:
  # Hours between repeating reminders when no time is specified
  default_interval_hours: 8

# ── Timezone ──────────────────────────────────
# Used when interpreting times like "at 4pm".
# See full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: "UTC"
